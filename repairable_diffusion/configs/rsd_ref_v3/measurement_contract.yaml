claim_boundary:
  primary: >-
    Under source-faithful reference diffusion decoding, ultimately failed trajectories can contain
    intermediate states from which a controlled local intervention recovers the correct answer.
    Final failure is an endpoint observation and does not imply universal intermediate irrecoverability.
  prohibit_without_separate_evidence:
    - universal irrecoverability point
    - monotonic temporal decay
    - causal reasoning recovery
    - reliable prospective localization
    - decoding superiority
    - efficiency superiority

